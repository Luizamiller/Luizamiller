name: Estatísticas do perfil

# Recalcula linguagens e números a partir do código dos repositórios públicos e atualiza os cartões do README.
on:
  schedule:
    - cron: "0 9 * * *"   # todo dia, 6h no horário de Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/estatisticas.py"]

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Calcular estatísticas
        run: python scripts/estatisticas.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Salvar cartões
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/linguagens-*.svg assets/numeros-*.svg
          git diff --cached --quiet || (git commit -m "Atualiza estatísticas do perfil" && git push)
